<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Todo App is a fast, accessible, mobile‑first task manager built with modern JavaScript, Vite, and SCSS."
    />
    <meta name="theme-color" content="#d4845c" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Todo App - Fast Accessible Task Manager"
    />
    <meta
      property="og:description"
      content="Organize your tasks easily. Fast, accessible, mobile‑first todo app."
    />
    <!-- Optional: set to your published URL -->
    <meta property="og:url" content="https://yujioyama.github.io/ToDo/" />
    <!-- Optional: social preview image -->
    <!-- <meta property="og:image" content="/assets/og-image.png" /> -->
    <!-- Optional: favicon and manifest -->
    <!-- <link rel="icon" href="/favicon.ico" /> -->
    <!-- <link rel="manifest" href="/site.webmanifest" /> -->
    <title>Todo App - Fast Accessible Task Manager</title>
    <script type="module" src="/src/js/main.js"></script>
  </head>
  <body class="theme-light">
    <div class="lang-switch">
      <label class="lang-switch__label" for="lang-switch" id="lang-label"
        >Language</label
      >
      <select class="lang-switch__select" id="lang-switch">
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>
    <main class="app">
      <header class="app-header">
        <div class="app-header__brand">
          <h1 class="app-header__title" id="app-title">Todo App</h1>
          <p class="app-header__tagline" id="app-tagline">
            Organize your tasks quickly and easily.
          </p>
        </div>
        <div class="app-header__toolbar">
          <button
            class="toolbar-button toolbar-button--accent js-theme-toggle"
            type="button"
            id="theme-toggle"
          >
            Toggle theme
          </button>
        </div>
      </header>

      <div class="app-shell">
        <aside class="app-shell__sidebar">
          <section class="panel">
            <h2 class="panel__title" id="panel-add-title">🌿 Add New Task</h2>
            <p class="panel__tagline" id="panel-add-tagline">
              Create a new task with alpaca-level organization and care.
            </p>
            <div class="panel__body">
              <div class="action-add">
                <div class="input-text">
                  <input
                    type="text"
                    class="input-text__input js-new-task-input"
                    id="new-task-input"
                    aria-label="New task"
                    placeholder="What fluffy task needs attention? 🦙"
                  />
                </div>
                <div class="input-date">
                  <input
                    type="date"
                    class="input-date__input js-new-task-date"
                    id="new-task-date"
                    aria-label="Due date"
                  />
                </div>
                <div class="input-select">
                  <select
                    name="priority"
                    class="input-select__select js-new-task-priority"
                    id="new-task-priority"
                    aria-label="Priority"
                  >
                    <option value="">Priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select>
                </div>
                <div class="input-text input-text--tags">
                  <input
                    type="text"
                    class="input-text__input js-new-task-tags"
                    id="new-task-tags"
                    aria-label="Tags"
                    placeholder="Tags (comma separated)"
                  />
                </div>
                <button
                  class="action-add__button js-add-new-task-trigger"
                  id="add-task-button"
                >
                  🦙 Add Task
                </button>
              </div>
            </div>
          </section>

          <section class="panel">
            <h2 class="panel__title" id="panel-refine-title">Refine</h2>
            <p class="panel__tagline" id="panel-refine-tagline">
              Search, filter, and sort to focus on what matters now.
            </p>
            <div class="panel__body">
              <div class="action">
                <div class="action__row">
                  <div class="action__title" id="action-title-search">
                    Search
                  </div>
                  <div class="action__search">
                    <div class="input-text">
                      <input
                        type="text"
                        class="input-text__input js-search"
                        aria-label="Search tasks"
                        placeholder="Search through your fluffy tasks..."
                      />
                    </div>
                  </div>
                </div>
                <div class="action__row">
                  <div class="action__title" id="action-title-status">
                    Status
                  </div>
                  <ul class="action-buttons js-filter">
                    <li class="action-buttons__list">
                      <label class="action-buttons__label">
                        <input
                          type="radio"
                          name="filter"
                          value="all"
                          class="action-buttons__input js-filter-trigger"
                          checked
                        />
                        <span class="action-buttons__text" id="filter-label-all"
                          >All</span
                        >
                      </label>
                    </li>
                    <li class="action-buttons__list">
                      <label class="action-buttons__label">
                        <input
                          type="radio"
                          name="filter"
                          value="active"
                          class="action-buttons__input js-filter-trigger"
                        />
                        <span
                          class="action-buttons__text"
                          id="filter-label-active"
                          >Active</span
                        >
                      </label>
                    </li>
                    <li class="action-buttons__list">
                      <label class="action-buttons__label">
                        <input
                          type="radio"
                          name="filter"
                          value="done"
                          class="action-buttons__input js-filter-trigger"
                        />
                        <span
                          class="action-buttons__text"
                          id="filter-label-done"
                          >Done</span
                        >
                      </label>
                    </li>
                  </ul>
                </div>
                <div class="action__row">
                  <div class="action__title" id="action-title-sort">Sort</div>
                  <div class="action__sort">
                    <div class="input-select">
                      <select
                        class="input-select__select js-sort"
                        id="sort-select"
                        aria-label="Sort tasks"
                      >
                        <option value="none">None</option>
                        <option value="dueDate">Due date</option>
                        <option value="priority">Priority</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="action__row">
                  <div class="action__title" id="action-title-tags">Tags</div>
                  <div class="action__filter">
                    <div class="input-text input-text--tags">
                      <input
                        type="text"
                        class="input-text__input js-tag-filter"
                        id="tag-filter-input"
                        aria-label="Filter tags"
                        placeholder="Filter tags (comma separated)"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </aside>

        <section class="app-shell__content">
          <section class="metrics" aria-label="Task overview">
            <metric-card
              label="Total Tasks"
              value="0"
              helper="All items across your lists"
              class="js-metric-total"
            ></metric-card>
            <metric-card
              label="Completed"
              value="0"
              helper="Tasks marked as done"
              class="js-metric-complete"
            ></metric-card>
            <metric-card
              label="In Progress"
              value="0"
              helper="Tasks still waiting for attention"
              class="js-metric-active"
            ></metric-card>
            <metric-card
              label="Completion"
              value="0%"
              helper="Share of tasks completed"
              class="js-metric-rate"
            ></metric-card>
          </section>

          <section class="panel panel--list">
            <h2 class="panel__title" id="panel-list-title">Task List</h2>
            <p class="panel__tagline" id="panel-list-tagline">
              Tap a task to edit inline, toggle, or remove it.
            </p>
            <div class="panel__body panel__body--flush">
              <div class="bulk-actions">
                <label class="bulk-actions__select">
                  <input
                    type="checkbox"
                    class="bulk-actions__checkbox js-select-all"
                    aria-label="Select all visible tasks"
                  />
                  <span id="select-all-label">Select all</span>
                </label>
                <div class="bulk-actions__buttons">
                  <button
                    class="toolbar-button js-bulk-complete"
                    id="bulk-complete-button"
                    type="button"
                    disabled
                  >
                    Mark selected complete
                  </button>
                  <button
                    class="toolbar-button toolbar-button--danger js-bulk-delete"
                    id="bulk-delete-button"
                    type="button"
                    disabled
                  >
                    Delete selected
                  </button>
                </div>
              </div>
              <ul class="todo-list js-todo-list"></ul>
            </div>
          </section>
        </section>
      </div>

      <div
        class="toast-layer js-toast-layer"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <template id="list-item-template">
        <li class="todo-list__item js-todo-list-item" data-id>
          <div class="todo-list__left">
            <input
              class="todo-list__select js-task-select"
              type="checkbox"
              aria-label="Select task"
            />
            <button
              class="todo-list__status js-task-status-trigger"
              aria-label="Mark as complete"
            ></button>
            <div class="todo-list__content">
              <span class="todo-list__text js-task-text"></span>
              <div class="todo-list__meta">
                <time class="todo-list__due js-task-due" hidden></time>
                <span
                  class="todo-list__priority js-task-priority"
                  hidden
                ></span>
                <span class="todo-list__tags js-task-tags" hidden></span>
              </div>
            </div>
          </div>

          <button class="todo-list__delete js-delete-task-trigger">
            Delete
          </button>
        </li>
      </template>
    </main>
  </body>
</html>
